<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Sandbox: architecture</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  svg { display: block; width: 100vw; height: 100vh; }
  text { font-family: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #15171A; }
  .zone { font-size: 44px; font-weight: 800; letter-spacing: -0.5px; }
  .t { font-size: 32px; font-weight: 700; }
  .lbl { font-size: 26px; font-weight: 650; fill: #4B5057; }
  .fig { font-size: 30px; font-weight: 700; }
  .box { fill: #fff; stroke: #C9CCD0; stroke-width: 2; }
  .a { fill: none; stroke: #15171A; stroke-width: 3; marker-end: url(#h); }
  .a2 { fill: none; stroke: #15171A; stroke-width: 3; marker-end: url(#h); marker-start: url(#h); }
  .person { fill: none; stroke: #15171A; stroke-width: 3.5; stroke-linecap: round; }
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15171A"/></marker>
  </defs>

  <!-- Employee -->
  <clipPath id="c1"><circle cx="190" cy="290" r="70"/></clipPath><image href="/personas/maya.png" x="120" y="220" width="140" height="140" clip-path="url(#c1)"/>
  <text x="190" y="400" class="fig" text-anchor="middle">Maya</text>
  <rect x="70" y="470" width="240" height="110" rx="16" class="box"/>
  <text x="190" y="537" class="t" text-anchor="middle">Claude</text>
  <path d="M190 410 V462" class="a"/>

  <!-- Admin -->
  <clipPath id="c2"><circle cx="190" cy="810" r="70"/></clipPath><image href="/personas/sam.png" x="120" y="740" width="140" height="140" clip-path="url(#c2)"/>
  <text x="190" y="920" class="fig" text-anchor="middle">Sam, admin</text>

  <!-- Archil -->
  <rect x="440" y="150" width="860" height="860" rx="26" fill="#F4F2EC" stroke="#15171A" stroke-width="5"/>
  <text x="480" y="215" class="zone">Archil</text>
  <rect x="520" y="270" width="700" height="120" rx="16" class="box" style="stroke:#15171A;stroke-width:3"/>
  <text x="870" y="343" class="t" text-anchor="middle">Golden sandbox</text>
  <path d="M870 390 V478" class="a"/><text x="890" y="445" class="lbl">copied</text>
  <rect x="520" y="490" width="210" height="120" rx="16" class="box"/>
  <rect x="765" y="490" width="210" height="120" rx="16" class="box"/>
  <rect x="1010" y="490" width="210" height="120" rx="16" class="box"/>
  <text x="625" y="540" class="t" text-anchor="middle" style="font-size:28px">Sandbox</text><text x="625" y="578" class="lbl" text-anchor="middle" style="font-size:22px">Maya</text>
  <text x="870" y="540" class="t" text-anchor="middle" style="font-size:28px">Sandbox</text><text x="870" y="578" class="lbl" text-anchor="middle" style="font-size:22px">Diego</text>
  <text x="1115" y="540" class="t" text-anchor="middle" style="font-size:28px">Sandbox</text><text x="1115" y="578" class="lbl" text-anchor="middle" style="font-size:22px">Priya</text>
  <path d="M870 610 V778" class="a"/><text x="890" y="700" class="lbl">logged</text>
  <rect x="520" y="790" width="700" height="120" rx="16" class="box" style="stroke:#15171A;stroke-width:3"/>
  <text x="870" y="863" class="t" text-anchor="middle">Registry</text>

  <!-- Our GCP -->
  <rect x="1440" y="150" width="420" height="860" rx="26" fill="#EEF6F1" stroke="#007A33" stroke-width="4"/>
  <text x="1480" y="215" class="zone" style="fill:#007A33">Our GCP</text>
  <rect x="1480" y="270" width="340" height="120" rx="16" class="box"/><text x="1650" y="343" class="t" text-anchor="middle">Connector</text>
  <rect x="1480" y="470" width="340" height="110" rx="16" class="box"/><text x="1650" y="537" class="t" text-anchor="middle">Builder</text>
  <rect x="1480" y="650" width="340" height="110" rx="16" class="box"/><text x="1650" y="717" class="t" text-anchor="middle">Apps</text>
  <rect x="1480" y="790" width="340" height="120" rx="16" class="box"/><text x="1650" y="863" class="t" text-anchor="middle">Admin page</text>

  <!-- who talks to what -->
  <path d="M318 525 H380 V105 H1760 V262" class="a2"/><text x="870" y="92" class="lbl" text-anchor="middle">spec · link</text>
  <path d="M1560 390 V445 H1150 V482" class="a"/><text x="1322" y="432" class="lbl" style="font-size:24px">build</text>
  
  <path d="M1220 545 H1472" class="a"/>
  <text x="1322" y="532" class="lbl" style="font-size:24px">code</text>
  <path d="M1650 580 V642" class="a"/><text x="1668" y="620" class="lbl" style="font-size:24px">deploy</text>
  <path d="M1480 850 H1228" class="a"/><text x="1322" y="838" class="lbl" style="font-size:24px">reads</text>
  <path d="M250 850 H380 V1045 H1650 V918" class="a"/><text x="870" y="1036" class="lbl" text-anchor="middle">uses</text>
</svg>
</body>
</html>
