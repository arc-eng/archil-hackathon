<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
  <main class="container">
    <h1>App</h1>
    <p>Replace this page with the app.</p>
  </main>
  <script>
    // Data this person keeps stays in their browser: it survives reloads and the server sleeping.
    const store = {
      get(key, fallback) {
        try { const v = localStorage.getItem("app:" + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
      },
      set(key, value) { localStorage.setItem("app:" + key, JSON.stringify(value)); },
    };
  </script>
</body>
</html>
