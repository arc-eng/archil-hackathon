[project]
name = "archil-hackathon"
version = "0.1.0"
description = "Marco's build for the Archil hackathon"
requires-python = ">=3.12"
dependencies = [
    "archil>=0.21.0",
    "google-cloud-build>=3.43.0",
    "google-cloud-storage>=3.17.1",
    "mcp>=1.20",
    "pydantic-ai-slim[anthropic,openai]>=2.66.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
